name: CI

on:
  push:
    branches: [main]
  pull_request:
  # weekly run against the latest server code, to catch upstream changes that break the provider
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      ma_ref:
        description: Music Assistant server branch or tag to test against (empty for dev and stable)
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check against server ${{ matrix.server }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # dev is what the provider is developed against; stable is the latest release, which
        # is what the Home Assistant add-on runs
        server: [dev, stable]
    env:
      MA_DIR: ${{ github.workspace }}/../music-assistant-server
    steps:
      - name: Pick the server version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.ma_ref }}
          SERVER: ${{ matrix.server }}
        run: |
          if [[ -n "$REQUESTED" ]]; then
            ref="$REQUESTED"
          elif [[ "$SERVER" == stable ]]; then
            ref="$(gh release view --repo music-assistant/server --json tagName --jq .tagName)"
          else
            ref=dev
          fi
          echo "Testing against server $ref"
          echo "MA_REF=$ref" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: scripts/dev_setup.sh

      - name: Set up the Music Assistant server
        run: scripts/dev_setup.sh

      - name: Run the checks
        run: scripts/check.sh

      - name: Run the pre-commit hooks
        run: |
          "$MA_DIR/.venv/bin/pre-commit" run --all-files --show-diff-on-failure
