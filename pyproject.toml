[project]
name = "music-assistant-ilpost"
version = "0.1.0"
description = "Il Post podcasts provider for Music Assistant"
readme = "README.md"
requires-python = ">=3.14"
# runtime dependencies come from the Music Assistant server the provider runs in

# Lint and type-check settings mirror the Music Assistant server repository, so the provider
# can be proposed upstream unchanged. scripts/check.sh also runs the server's own config.
[tool.ruff]
fix = true
show-fixes = true
line-length = 100
target-version = "py314"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["ALL"]
extend-select = ["D213"]
ignore = [
  "ANN002",
  "ANN003",
  "ANN401",
  "D203",
  "D417",
  "EM101",
  "EM102",
  "FIX002",
  "PLR2004",
  "PGH004",
  "PD011",
  "S101",
  "TC001",
  "TC003",
  "TD002",
  "TD003",
  "TD004",
  "TRY003",
  "TRY400",
  "COM812",
  "ASYNC109",
  "ASYNC110",
  "N818",
  "E501",
  "ASYNC240",
  "UP047",
  "PLW0108",
  "CPY001",
  "LOG004",
  "FURB110",
  "FBT001",
  "FBT002",
  "FBT003",
  "ANN001",
  "ANN202",
  "PTH118",
  "PTH120",
  "PTH123",
  "S106",
  "SLF001",
  "SIM102",
  "PERF401",
  "ARG002",
  "B904",
  "S324",
  "S304",
  "TRY300",
  "S608",
  "ANN204",
  "ISC004",
  "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
# tests use made-up tokens and passwords as fixtures
"tests/**" = ["S104", "S105", "S107"]
# manual exploration scripts: they print, run top to bottom and set made-up tokens
"scripts/**" = ["T201", "INP001", "D103", "PLR0915", "S105"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 25
max-returns = 15
max-statements = 50

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["music_assistant"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.mypy]
platform = "linux"
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true
disable_error_code = ["annotation-unchecked", "import-not-found", "import-untyped"]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
enable_error_code = ["ignore-without-code", "possibly-undefined", "redundant-self", "truthy-iterable"]
extra_checks = true
local_partial_types = true
no_implicit_optional = true
no_implicit_reexport = true
show_error_codes = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
timeout = 60
filterwarnings = ["ignore:coroutine.*was never awaited:RuntimeWarning"]

[tool.coverage.run]
source = ["music_assistant.providers.ilpost"]
branch = true
